name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: OFL license gate
        run: |
          if (-not (Test-Path assets/fonts/OFL.txt)) {
            if ("${{ github.ref }}" -like "refs/tags/v*") {
              Write-Error "缺 assets/fonts/OFL.txt: 带 Noto 子集的 release 必须附 SIL OFL 1.1 全文"
            }
            Write-Warning "缺 assets/fonts/OFL.txt (只有打 tag 的 release 会因此失败)"
          }

      - name: test
        run: cargo test --workspace --release

      - name: build
        run: cargo build --release --locked

      - name: package
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/clowder.exe dist/
          Copy-Item -Recurse assets dist/assets
          Compress-Archive -Path dist/* -DestinationPath clowder-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: clowder-windows
          path: clowder-windows.zip

      # 打 v* tag 时发 Release; 用 runner 自带的 gh, 不引第三方 action
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" clowder-windows.zip --title "Clowder `${{ github.ref_name }}" --generate-notes

  # 调试版: 不带 --release, 只编不测, 产物单独上传, 不进 Release
  build-debug:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: debug

      - name: build (debug)
        run: cargo build --locked

      - name: package (debug)
        run: |
          New-Item -ItemType Directory -Force -Path dist-debug | Out-Null
          Copy-Item target/debug/clowder.exe dist-debug/
          Copy-Item -Recurse assets dist-debug/assets
          Compress-Archive -Path dist-debug/* -DestinationPath clowder-windows-debug.zip

      - uses: actions/upload-artifact@v5
        with:
          name: clowder-windows-debug
          path: clowder-windows-debug.zip
